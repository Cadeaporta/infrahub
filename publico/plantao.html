<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>InfraHub · Plantão</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0A0E17;
    --panel: #161D30;
    --line: #262F47;
    --accent: #F2793A;
    --accent-2: #3E7BF2;
    --text: #EDF1F7;
    --text-dim: #8792AB;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 48px;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .logo { display: flex; align-items: center; gap: 16px; }

  .dot {
    width: 16px; height: 16px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(242,121,58,0.5); }
    50% { opacity: 0.6; box-shadow: 0 0 0 8px rgba(242,121,58,0); }
  }

  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 40px;
    margin: 0;
  }

  .sub { color: var(--text-dim); font-size: 14px; margin-top: 4px; }

  .relogio {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
  }

  .relogio .hora {
    font-size: 48px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .relogio .data {
    color: var(--text-dim);
    font-size: 18px;
    margin-top: 4px;
    text-transform: capitalize;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px;
    min-height: 420px;
    display: flex;
    flex-direction: column;
  }

  .card h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin: 0 0 24px 0;
  }

  .linha-equipe {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
    font-size: 22px;
  }
  .linha-equipe:last-child { border-bottom: none; }

  .linha-equipe .nome { display: flex; align-items: center; gap: 12px; }

  .bolinha {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }
  .bolinha.ativo {
    background: var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  .horario { font-family: 'JetBrains Mono', monospace; color: var(--text-dim); font-size: 18px; }

  .plantao-central {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .plantao-nome {
    font-family: 'JetBrains Mono', monospace;
    font-size: 56px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .plantao-horario { color: var(--text-dim); font-size: 22px; margin-top: 16px; }

  .vazio { color: var(--text-dim); font-size: 18px; text-align: center; margin: auto; }

  input, select {
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 18px;
  }
  select { font-family: 'JetBrains Mono', monospace; }

  .linha-equipe { gap: 12px; }
  .linha-equipe .nome { flex: 1; }
  .linha-equipe input.nome-input {
    flex: 1;
    font-size: 20px;
  }

  .acoes {
    display: flex;
    gap: 8px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .linha-equipe:hover .acoes { opacity: 1; }

  .btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 6px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.perigo:hover { border-color: #EF5A5A; color: #EF5A5A; }

  .form-add {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .form-add input { flex: 1; }

  .plantao-editar {
    margin-top: 20px;
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 360px;
  }
  .plantao-editar input { flex: 1; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="dot"></span>
    <div>
      <h1>InfraHub</h1>
      <p class="sub">Vera Cruz · Braga IT</p>
    </div>
  </div>
  <div class="relogio">
    <div class="hora" id="hora">--:--</div>
    <div class="data" id="data"></div>
  </div>
</header>

<div class="grid">
  <div class="card">
    <h2>Horário de trabalho</h2>
    <div id="equipe"></div>
  </div>

  <div class="card">
    <h2>Plantão de hoje</h2>
    <div id="plantao" class="plantao-central"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://koiiqafjmlnsdkijnwmi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Uv8bl8Ont7pAQju9WrBJww_aoR2KTSp";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function atualizarRelogio() {
    const agora = new Date();
    document.getElementById("hora").textContent = agora.toLocaleTimeString("pt-BR", {
      hour: "2-digit",
      minute: "2-digit",
    });
    document.getElementById("data").textContent = agora.toLocaleDateString("pt-BR", {
      weekday: "long",
      day: "2-digit",
      month: "long",
    });
  }

  async function carregarDados() {
    const agora = new Date();
    const hojeISO = agora.toISOString().slice(0, 10);
    const horaAtual = agora.getHours() + agora.getMinutes() / 60;
    const ehFimDeSemana = agora.getDay() === 0 || agora.getDay() === 6;

    const [{ data: equipe }, { data: plantaoHoje }] = await Promise.all([
      supabase.from("escala_equipe").select("*").order("entrada").order("nome"),
      supabase.from("plantoes").select("*").eq("data", hojeISO).maybeSingle(),
    ]);

    // --- Equipe ---
    const equipeEl = document.getElementById("equipe");
    equipeEl.innerHTML = "";
    if (!equipe || equipe.length === 0) {
      equipeEl.innerHTML = '<p class="vazio">Ninguém cadastrado ainda.</p>';
    } else {
      for (const m of equipe) {
        const presente = !ehFimDeSemana && horaAtual >= m.entrada && horaAtual < m.entrada + 9;
        const linha = document.createElement("div");
        linha.className = "linha-equipe";

        const opcoesEntrada = [7, 8, 9, 10]
          .map((h) => `<option value="${h}" ${h === m.entrada ? "selected" : ""}>${h}:00 – ${h + 9}:00</option>`)
          .join("");

        linha.innerHTML = `
          <span class="bolinha ${presente ? "ativo" : ""}"></span>
          <input class="nome-input" value="${m.nome}" data-id="${m.id}" data-campo="nome" />
          <select data-id="${m.id}" data-campo="entrada">${opcoesEntrada}</select>
          <div class="acoes">
            <button class="btn" data-acao="salvar-membro" data-id="${m.id}">Salvar</button>
            <button class="btn perigo" data-acao="remover-membro" data-id="${m.id}">Remover</button>
          </div>
        `;
        equipeEl.appendChild(linha);
      }
    }

    // formulário de adicionar
    const formAdd = document.createElement("div");
    formAdd.className = "form-add";
    formAdd.innerHTML = `
      <input id="novo-nome" placeholder="Novo nome" />
      <select id="novo-entrada">
        <option value="7">7:00 – 16:00</option>
        <option value="8" selected>8:00 – 17:00</option>
        <option value="9">9:00 – 18:00</option>
        <option value="10">10:00 – 19:00</option>
      </select>
      <button class="btn" id="btn-adicionar">+ Adicionar</button>
    `;
    equipeEl.appendChild(formAdd);

    document.querySelectorAll('[data-acao="salvar-membro"]').forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id;
        const linha = btn.closest(".linha-equipe");
        const nome = linha.querySelector('[data-campo="nome"]').value.trim();
        const entrada = Number(linha.querySelector('[data-campo="entrada"]').value);
        if (!nome) return;
        await supabase.from("escala_equipe").update({ nome, entrada }).eq("id", id);
        carregarDados();
      });
    });

    document.querySelectorAll('[data-acao="remover-membro"]').forEach((btn) => {
      btn.addEventListener("click", async () => {
        await supabase.from("escala_equipe").delete().eq("id", btn.dataset.id);
        carregarDados();
      });
    });

    document.getElementById("btn-adicionar").addEventListener("click", async () => {
      const nome = document.getElementById("novo-nome").value.trim();
      const entrada = Number(document.getElementById("novo-entrada").value);
      if (!nome) return;
      await supabase.from("escala_equipe").insert({ nome, entrada });
      carregarDados();
    });

    // --- Plantão ---
    const plantaoEl = document.getElementById("plantao");
    plantaoEl.innerHTML = `
      <div class="plantao-nome">${plantaoHoje ? plantaoHoje.nome : "—"}</div>
      <div class="plantao-horario">${ehFimDeSemana ? "6h – 6h" : "19h – 7h"}</div>
      <div class="plantao-editar">
        <input id="plantao-nome-input" placeholder="Nome do plantonista" value="${plantaoHoje ? plantaoHoje.nome : ""}" />
        <button class="btn" id="btn-salvar-plantao">Salvar</button>
      </div>
    `;

    document.getElementById("btn-salvar-plantao").addEventListener("click", async () => {
      const nome = document.getElementById("plantao-nome-input").value.trim();
      if (!nome) {
        await supabase.from("plantoes").delete().eq("data", hojeISO);
      } else {
        await supabase.from("plantoes").upsert({ data: hojeISO, nome }, { onConflict: "data" });
      }
      carregarDados();
    });
  }

  atualizarRelogio();
  carregarDados();
  setInterval(atualizarRelogio, 1000);
  setInterval(carregarDados, 30000);
</script>

</body>
</html>
